[build-system]
requires = ["maturin>=1,<2", "numpy<3"]
build-backend = "maturin"

[project]
name = "procdarn"
version = "0.1.0"
requires-python = ">=3.8"
authors = [
    { name = "Remington Rohel" }
]
classifiers = [
    "Programming Language :: Python",
    "Programming Language :: Rust"
]
dependencies = ["numpy<3"]

[tool.maturin]
bindings = "pyo3"
features = ["pyo3/extension-module"]
profile = "release"
compatibility = "manylinux2014"
auditwheel = "repair"
strip = true
python-source = "python"
module-name = "procdarn.procdarn_rs"

[project.scripts]
raw2fit = "procdarn:raw2fit_cli"
fit2grid = "procdarn:fit2grid_cli"
