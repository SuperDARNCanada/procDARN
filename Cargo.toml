[package]
name = "procdarn"
version = "0.1.0"
edition = "2021"
rust-version = "1.74.1"

[dependencies]
aacgmv2-rs = { git = "https://github.com/SuperDARNCanada/aacgmv2-rs.git", branch = "riir" }
chrono = "0.4.44"
clap = { version = "4.2.7", features = ["derive"] }
darn-dmap = "0.7.0"
igrf = { git = "https://github.com/SuperDARNCanada/igrf.git", branch = "main" }
indexmap = "2.3.0"
is_close = "0.1.3"
itertools = "0.10.5"
numpy = "0.26.0"
pyo3 = { version = "0.26.0", features = ["extension-module", "indexmap", "abi3-py38"] }
rust-embed = "6.6.1"
rayon = "1.7.0"
thiserror = "1.0.64"
time = "0.3.41"

[build-dependencies]
git2 = { version = "0.20.4", features = ["vendored-openssl"] }

[dev-dependencies]
approx = "0.5.1"
assert_unordered = "0.3.5"
criterion = { version = "0.4", features = ["html_reports"] }
glob = "0.3.2"
ndarray = { version = "0.16.1", features = ["approx"] }

[[bench]]
name = "fitacf3"
harness = false

[lib]
name = "procdarn"
path = "src/lib.rs"
