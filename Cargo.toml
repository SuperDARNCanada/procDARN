[package]
name = "procdarn"
version = "0.1.0"
edition = "2021"
rust-version = "1.74.1"

[dependencies]
aacgmv2-rs = { version = "0.1.0", path = "/home/radar/repos/aacgmv2-rs"}
bytemuck = "1.13.1"
chrono = "0.4.24"
clap = { version = "4.2.7", features = ["derive"] }
indexmap = "2.3.0"
is_close = "0.1.3"
itertools = "0.10.5"
numpy = "0.22.0"
pyo3 = { version = "0.22.5", features = ["extension-module", "indexmap", "abi3-py38"] }
dmap = { git = "https://github.com/SuperDARNCanada/dmap.git", tag = "v0.1.6" }
rust-embed = "6.6.1"
rayon = "1.7.0"
thiserror = "1.0.64"
geodesy = "0.11.0"
igrf = "0.2.0"
time = "0.3.30"

[build-dependencies]
git2 = { version = "0.17.1", features = ["vendored-openssl"] }

[dev-dependencies]
approx = "0.5.1"
assert_unordered = "0.3.5"
criterion = { version = "0.4", features = ["html_reports"] }
ndarray = { version = "0.16.1", features = ["approx"] }

[[bench]]
name = "fitacf3"
harness = false

[lib]
name = "procdarn"
path = "src/lib.rs"
